<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Ben 10 — Alien Force Web Prototype</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="boot">
    <b id="bootTitle">Запуск 3D-сцены…</b>
    <div id="bootText">Загружаю Babylon.js.</div>
  </div>

  <section id="hud">
    <b>Ben 10 · Alien Force prototype</b><br>
    <span id="formBadge">БЕН</span>
    <div class="label">HP <span id="playerHpText">100</span>/100</div>
    <div class="bar"><div id="playerHpBar" class="fill"></div></div>
    <div class="label">Враг <span id="enemyHpText">100</span>/100</div>
    <div class="bar"><div id="enemyHpBar" class="fill enemy"></div></div>
    <div id="stats"></div>
  </section>

  <div id="omnitrixMenu" aria-hidden="true">
    <div class="omni-card">
      <div class="omni-title">ОМНИТРИКС</div>
      <div class="alien-grid">
        <button data-form="BEN"><span>👤</span>Бен</button>
        <button data-form="HEATBLAST"><span>🔥</span>Пламенный</button>
        <button data-form="HUMUNGOUSAUR"><span>🦖</span>Гумангозавр</button>
        <button data-form="ECHO_ECHO"><span>🔊</span>Эхо Эхо</button>
      </div>
      <div class="omni-hint">Выберите форму</div>
    </div>
  </div>

  <div id="leftPad"><div id="stick"></div></div>
  <div id="actionCluster">
    <button id="ability2Btn" class="action ability" aria-label="Способность 2">A2</button>
    <button id="omniBtn" class="action omni">OMNI</button>
    <button id="ability1Btn" class="action ability" aria-label="Способность 1">A1</button>
    <button id="attackBtn" class="action attack">АТАКА</button>
  </div>
  <div id="hint">Камера — свайп · атака — красная кнопка</div>

  <script>
    const boot=document.getElementById('boot');
    const title=document.getElementById('bootTitle');
    const text=document.getElementById('bootText');
    const cdns=[
      'https://cdn.babylonjs.com/babylon.js',
      'https://cdn.jsdelivr.net/npm/babylonjs/babylon.js',
      'https://unpkg.com/babylonjs/babylon.js'
    ];
    function status(t,x=''){ title.textContent=t; text.textContent=x; }
    function startGameModule(){
      return import('./src/game.js').then(m=>m.startGame()).catch(err=>{
        console.error(err); status('Ошибка загрузки игры',err?.message||String(err));
      });
    }
    function loadBabylon(i=0){
      if(window.BABYLON) return startGameModule();
      if(i>=cdns.length){ status('Babylon.js не загрузился','Откройте страницу в Chrome или Safari.'); return; }
      status('Запуск 3D-сцены…','Попытка '+(i+1)+' из '+cdns.length);
      const s=document.createElement('script');
      s.src=cdns[i]; s.async=true;
      s.onload=()=>window.BABYLON?startGameModule():loadBabylon(i+1);
      s.onerror=()=>loadBabylon(i+1);
      document.head.appendChild(s);
    }
    loadBabylon();
  </script>
</body>
</html>
